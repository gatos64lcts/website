<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
  setInterval(async () => {
    try {
      const response = await fetch('./version.json?_=' + Date.now());
      const data = await response.json();
      const currentVersion = localStorage.getItem('mophra_version');
      
      if (!currentVersion) {
        localStorage.setItem('mophra_version', data.version);
      } else if (currentVersion !== data.version) {
        localStorage.setItem('mophra_version', data.version);
        window.location.reload();
      }
    } catch (err) {
    }
  }, 60000);
</script>

    .error-btn:hover {

    @keyframes dropIn {

<!-- PRECARGA OPTIMIZADA DE LA CORTINA -->
<link rel="preload" href="../resources/cortina-000000.webp" as="image">

<!-- CORTINA METÁLICA DE TRANSICIÓN -->
<div id="cortina-transicion" class="cortina-contenedor">
    <img src="../resources/cortina-000000.webp" alt="Cargando..." class="cortina-imagen">
</div>

<style>
    .cortina-contenedor {
        position: fixed;
        top: -15vh;
        left: 0;
        width: 100vw;
        height: 115vh;
        background-color: #1a1a1a;
        z-index: 9999999 !important;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        pointer-events: none;
        transform: translateY(0%);
    }

    .cortina-contenedor.cerrar {
        pointer-events: auto;
        transform: translateY(0%);
        transition: transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.05) !important;
    }

    .cortina-contenedor.abrir {
        transform: translateY(-100%);
        transition: transform 0.7s cubic-bezier(0.6, -0.28, 0.735, 0.045) !important;
    }

    .cortina-imagen {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
</style>

<script>
    (function() {
        const cortina = document.getElementById('cortina-transicion');

        function abrirCortina() {
            if (cortina) {
                cortina.classList.remove('cerrar');
                cortina.classList.add('abrir');
            }
        }

        window.addEventListener('load', () => {
            setTimeout(abrirCortina, 100);
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted && cortina) {
                cortina.classList.remove('cerrar');
                cortina.classList.add('abrir');
            }
        });

        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link) return;

            const href = link.getAttribute('href');
            if (href && (href.startsWith('/') || href.startsWith('.')) && !link.getAttribute('target') && !link.hasAttribute('download')) {
                e.preventDefault();
                
                if (cortina) {
                    cortina.classList.remove('abrir');
                    cortina.classList.add('cerrar');
                }

                setTimeout(() => {
                    window.location.href = href;
                }, 500);
            }
        });
    })();
</script>
