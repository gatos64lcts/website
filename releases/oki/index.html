<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOPHRA | Compilations</title>
    <link rel="icon" type="image/png" href="/icon.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Fallback para tipografía industrial/mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- PRECARGA OPTIMIZADA DE LA CORTINA -->
    <link rel="preload" href="../../resources/cortina-000000.webp" as="image">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Chakra Petch"', 'sans-serif'],
                        mono: ['"Share Tech Mono"', 'monospace'],
                        relicus: ['"RelicusMono"', '"Share Tech Mono"', 'monospace'],
                    },
                    colors: {
                        neonPink: '#ff0055',
                        mophraRed: '#F5260A',
                        mophraYellow: '#fae100',
                    }
                }
            }
        }
    </script>

    <style>
        /* --- CARGA DE FUENTE PERSONALIZADA --- */
        @font-face {
            font-family: 'RelicusMono';
            src: url('../../resources/relicusmono.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- SELECCIÓN DE TEXTO GLOBAL --- */
        *::selection, ::selection {
            background-color: #fae100 !important;
            color: #030303 !important;
        }

        /* Estilos base */
        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #0b0b0e;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* --- EFECTO TYPEWRITER CENTRADO PARA TÍTULO 'compilations' (12 letras = 12 pasos) --- */
        .mophra-tw-header {
            width: 100%;
            padding-top: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (min-width: 769px) {
            .mophra-tw-header {
                padding-top: 38px;
            }
        }

        .mophra-typewriter-compilations {
            font-family: 'RelicusMono', 'Share Tech Mono', monospace !important;
            font-size: 30px;
            line-height: 1.2;
            color: #ffffff;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            max-width: 0;
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.9);
            animation: mophraTypewriterCompilations 0.75s steps(12, end) 0.45s forwards;
        }

        .mophra-typewriter-compilations::after {
            content: '▋';
            display: inline-block;
            color: #ffffff;
            font-size: 24px;
            margin-left: 4px;
            opacity: 1;
            animation: mophraBlink 0.5s step-end infinite 0.45s;
        }

        @keyframes mophraTypewriterCompilations {
            from { max-width: 0; }
            to { max-width: 310px; }
        }

        @keyframes mophraBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @media (min-width: 480px) {
            .mophra-typewriter-compilations { font-size: 38px; }
            .mophra-typewriter-compilations::after { font-size: 30px; }
            @keyframes mophraTypewriterCompilations {
                from { max-width: 0; }
                to { max-width: 390px; }
            }
        }

        @media (min-width: 769px) {
            .mophra-typewriter-compilations { font-size: 52px; }
            .mophra-typewriter-compilations::after { font-size: 40px; }
            @keyframes mophraTypewriterCompilations {
                from { max-width: 0; }
                to { max-width: 540px; }
            }
        }

        /* --- ESTILOS CORTINA METÁLICA DE TRANSICIÓN --- */
        .cortina-contenedor {
            position: fixed;
            top: -15vh;
            left: 0;
            width: 100vw;
            height: 115vh;
            background: linear-gradient(135deg, #141416 0%, #2a2c32 50%, #101012 100%);
            z-index: 9999999 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            pointer-events: none;
            transform: translateY(0%);
        }

        .cortina-contenedor.cerrar {
            pointer-events: auto;
            transform: translateY(0%);
            transition: transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.05) !important;
        }

        .cortina-contenedor.abrir {
            transform: translateY(-100%);
            transition: transform 0.7s cubic-bezier(0.6, -0.28, 0.735, 0.045) !important;
        }

        .cortina-imagen {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- MENÚ GLOBAL MOPHRA --- */
        .mophra-global-container {
            position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
            width: 100% !important; height: 100vh !important;
            background-color: transparent !important;
            overflow: hidden !important;
            overflow-x: hidden !important;
            font-family: 'RelicusMono', 'Share Tech Mono', monospace !important; user-select: none !important; z-index: 999999 !important; pointer-events: none !important;
        }

        @keyframes entradaBotonIzquierda { 0% { transform: translateY(-100px); opacity: 0; } 70% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes salidaBotonIzquierda { 0% { transform: translateY(0); opacity: 1; } 30% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }

        .mophra-global-btn {
            position: fixed !important; top: 30px !important; left: 30px !important; z-index: 1000000 !important;
            background: rgba(255, 255, 255, 0.1) !important; border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 50% !important; width: 78px !important; height: 78px !important; cursor: pointer !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            backdrop-filter: blur(5px) !important; pointer-events: auto !important; padding: 0 !important; opacity: 0 !important;
            transition: background 0.3s, transform 0.3s !important;
        }

        .mophra-global-btn.animar-entrada { opacity: 1 !important; animation: entradaBotonIzquierda 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
        .mophra-global-btn.animar-salida { opacity: 1 !important; animation: salidaBotonIzquierda 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
        .mophra-global-btn:hover { background: rgba(255, 255, 255, 0.25) !important; transform: scale(1.05) !important; }

        .mophra-svg-element { width: 76px !important; height: 76px !important; display: block !important; transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: none; }
        #mophraVectorPath { transition: opacity 0.2s ease, d 0.2s ease; }
        .mophra-global-container.menu-open .mophra-svg-element { transform: rotate(180deg); }
        .mophra-global-container.menu-open { pointer-events: auto !important; }

        .mophra-global-overlay {
            position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important;
            background-color: #000000 !important;
            transform: translateX(-100%) !important;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1) !important;
            pointer-events: none !important;
        }
        .mophra-global-container.menu-open .mophra-global-overlay { transform: translateX(0) !important; pointer-events: auto !important; }

        .mophra-signs-nav {
            position: absolute !important; left: 0 !important; top: 0 !important; height: 100% !important; max-height: 100vh !important;
            display: flex !important; flex-direction: column !important; align-items: flex-start !important;
            padding-left: 40px !important; padding-top: 130px !important; padding-bottom: 30px !important; box-sizing: border-box !important;
            z-index: 100000 !important; pointer-events: none !important;
            overflow-y: auto !important; overflow-x: hidden !important;
        }
        .mophra-global-container.menu-open .mophra-signs-nav { pointer-events: auto !important; }

        .mophra-sign-item {
            display: block !important; color: #ffffff !important; text-decoration: none !important; text-transform: uppercase !important;
            font-weight: 900 !important; font-size: clamp(40px, 5.5vw, 80px) !important; line-height: 0.92 !important; letter-spacing: -2px !important;
            transform: translateX(-100vw) !important; transform-origin: left center !important; width: max-content !important;
            pointer-events: none !important; visibility: hidden !important;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1), color 0.1s ease 0s, visibility 0s linear 0.4s !important;
        }
        .mophra-global-container.menu-open .mophra-sign-item { transform: translateX(0) !important; pointer-events: auto !important; visibility: visible !important; }
        .mophra-global-container.menu-open .mophra-sign-item:nth-child(1) { transition-delay: 0.15s, 0s, 0.15s !important; }
        .mophra-global-container.menu-open .mophra-sign-item:nth-child(2) { transition-delay: 0.22s, 0s, 0.22s !important; }
        .mophra-global-container.menu-open .mophra-sign-item:nth-child(3) { transition-delay: 0.29s, 0s, 0.29s !important; }
        .mophra-global-container.menu-open .mophra-sign-item:nth-child(4) { transition-delay: 0.36s, 0s, 0.36s !important; }
        .mophra-global-container.menu-open .mophra-sign-item:nth-child(5) { transition-delay: 0.43s, 0s, 0.43s !important; }

        a.mophra-sign-item:hover, .mophra-sign-link:hover { color: #969696 !important; }

        .mophra-dropdown-wrapper { display: flex !important; flex-direction: column !important; align-items: flex-start !important; }
        .mophra-sign-header { display: flex !important; align-items: center !important; justify-content: flex-start !important; gap: 18px !important; width: 100% !important; }
        .mophra-sign-link { color: inherit !important; text-decoration: none !important; }
        .mophra-submenu-toggle { background: none !important; border: none !important; cursor: pointer !important; padding: 0 !important; display: flex !important; align-items: center !important; }

        .mophra-frolov-icon {
            width: clamp(28px, 3.8vw, 44px) !important; height: clamp(20px, 3vw, 30px) !important;
            display: flex !important; flex-direction: column !important; justify-content: space-between !important; position: relative !important;
        }
        .mophra-frolov-icon span {
            display: block !important; height: clamp(3px, 0.4vw, 5px) !important; background-color: #ffffff !important; border-radius: 10px !important;
            transition: transform 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.25s ease, width 0.3s ease, margin 0.3s ease !important;
            transform-origin: center !important;
        }
        .mophra-frolov-icon .line-top { width: 40% !important; margin-left: auto !important; margin-right: 0 !important; }
        .mophra-frolov-icon .line-mid { width: 100% !important; margin-right: auto !important; }
        .mophra-frolov-icon .line-bot { width: 60% !important; margin-right: auto !important; }

        .mophra-dropdown-wrapper.submenu-open .mophra-frolov-icon .line-top {
            width: 100% !important; margin-left: 0 !important;
            transform: translateY(calc(clamp(20px, 3vw, 30px) / 2 - clamp(3px, 0.4vw, 5px) / 2)) rotate(45deg) !important;
        }
        .mophra-dropdown-wrapper.submenu-open .mophra-frolov-icon .line-mid { opacity: 0 !important; transform: scaleX(0) !important; }
        .mophra-dropdown-wrapper.submenu-open .mophra-frolov-icon .line-bot {
            width: 100% !important; margin-left: 0 !important;
            transform: translateY(calc(-1 * (clamp(20px, 3vw, 30px) / 2 - clamp(3px, 0.4vw, 5px) / 2))) rotate(-45deg) !important;
        }

        .mophra-submenu {
            display: flex !important; flex-direction: column !important; align-items: flex-start !important;
            max-height: 0 !important; overflow: hidden !important; opacity: 0 !important;
            transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease !important; margin-top: 0px !important;
            padding-right: 20px !important;
        }
        .mophra-dropdown-wrapper.submenu-open .mophra-submenu { max-height: 300px !important; opacity: 1 !important; margin-top: 10px !important; }

        .mophra-sub-item {
            color: #a0a0a0 !important; text-decoration: none !important; text-transform: lowercase !important;
            font-size: clamp(20px, 3vw, 36px) !important; padding: 4px 0 !important;
            transition: color 0.2s ease, transform 0.2s ease !important; display: block !important;
        }
        .mophra-sub-item:hover { color: #ffffff !important; transform: translateX(5px) !important; }

        @media (max-width: 768px) {
            .mophra-global-btn { top: 12px !important; left: 12px !important; width: 54px !important; height: 54px !important; }
            .mophra-svg-element { width: 36px !important; height: 36px !important; }
            .mophra-sign-item { font-size: clamp(48px, 10vw, 58px) !important; }
            .mophra-sub-item { font-size: clamp(28px, 7vw, 34px) !important; }
            .mophra-signs-nav { padding-left: 15px !important; padding-top: 85px !important; }

            .mophra-frolov-icon { width: 26px !important; height: 20px !important; }
            .mophra-frolov-icon span { height: 3px !important; }
            .mophra-dropdown-wrapper.submenu-open .mophra-frolov-icon .line-top { transform: translateY(8.5px) rotate(45deg) !important; }
            .mophra-dropdown-wrapper.submenu-open .mophra-frolov-icon .line-bot { transform: translateY(-8.5px) rotate(-45deg) !important; }
        }

        /* --- SCROLLBAR Y BLOQUES DEL MENÚ (4 ELEMENTOS EXACTOS) --- */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #ff0055;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #ff3377;
        }

        /* Contenedor exacto para 4 botones de 44px + 3 gaps de 8px + 2px padding = 202px */
        #menu-list {
            height: 202px;
            padding-top: 1px;
            padding-bottom: 1px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* Bloque rectangular con desenfoque (blur) para ítems no seleccionados */
        .menu-item {
            height: 44px;
            min-height: 44px;
            max-height: 44px;
            flex-shrink: 0;
            transition: background-color 0.2s ease, transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, backdrop-filter 0.2s ease;
            position: relative;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: rgba(15, 15, 20, 0.45) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .menu-item:hover {
            background-color: rgba(30, 30, 40, 0.6) !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
        }

        .menu-item.active {
            background-color: #ff0055 !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border-color: #ff0055 !important;
            color: #ffffff !important;
            transform: translateX(5px);
            box-shadow: 4px 0 14px rgba(255, 0, 85, 0.65);
        }
        .menu-item.active::after {
            content: '';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 7px;
            height: 7px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        /* Transición suave con zoom cinemático para cambio de fondo */
        .bg-layer {
            transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 1.1s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.75s ease;
            will-change: opacity, transform;
        }

        /* Animaciones para cambio de datos */
        .fade-in-element {
            animation: slideBlurIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .cover-zoom-in {
            animation: coverReveal 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .card-pulse-transition {
            animation: cardBorderPulse 0.5s ease-out;
        }

        @keyframes slideBlurIn {
            0% {
                opacity: 0;
                transform: translateY(7px);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes coverReveal {
            0% {
                opacity: 0.25;
                transform: scale(0.92);
                filter: brightness(1.5) contrast(1.15);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1) contrast(1);
            }
        }

        @keyframes cardBorderPulse {
            0% {
                box-shadow: 0 0 0 2px rgba(255, 0, 85, 0.8), 0 20px 35px rgba(255, 0, 85, 0.28);
            }
            100% {
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            }
        }

        /* Efecto scanline retro para el fondo (atenuado) */
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.15) 50%,
                rgba(0, 0, 0, 0.15)
            );
            background-size: 100% 4px;
        }

        /* --- POSICIÓN EXACTA DEL MENÚ DE COMPILACIONES --- */
        #main-selector-area {
            align-items: flex-start;
            padding-top: 25px;
        }

        /* --- AJUSTES EXCLUSIVOS PARA MÓVIL (< 768px) --- */
        @media (max-width: 767px) {
            #main-selector-area {
                align-items: flex-start !important;
                padding-top: 6px !important;
            }

            #menu-list {
                height: auto !important;
                flex-direction: row !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
                scroll-snap-type: x mandatory !important;
                scroll-behavior: smooth !important;
                gap: 10px !important;
                padding-right: 0 !important;
                padding-bottom: 4px !important;
                scrollbar-width: none;
            }
            #menu-list::-webkit-scrollbar {
                display: none;
            }

            .menu-item {
                min-width: 100% !important;
                width: 100% !important;
                justify-content: center !important;
                text-align: center !important;
                scroll-snap-align: center !important;
                scroll-snap-stop: always !important;
            }
            .menu-item span {
                padding-right: 0 !important;
            }
            .menu-item.active {
                transform: none !important;
                box-shadow: 0 0 14px rgba(255, 0, 85, 0.65) !important;
            }

            #menu-banner-container {
                height: 52px !important;
            }

            #mobile-footer-wrapper {
                padding-bottom: calc(40px + env(safe-area-inset-bottom, 30px)) !important;
            }
            #data-glass-card {
                background-color: rgba(255, 255, 255, 0.24) !important;
                backdrop-filter: blur(3px) !important;
                -webkit-backdrop-filter: blur(3px) !important;
                border: 1px solid rgba(255, 255, 255, 0.35) !important;
            }
            #data-description-box {
                background-color: rgba(255, 255, 255, 0.20) !important;
                border-color: rgba(255, 255, 255, 0.3) !important;
            }
            #data-catalog,
            #data-catalog i,
            #data-contains-label,
            #data-tracks,
            #data-desc-label,
            #data-description {
                color: #ffffff !important;
            }
            #data-contains-label,
            #data-desc-label {
                opacity: 0.85;
            }
        }
    </style>
</head>
<body class="w-full relative text-white flex flex-col justify-between">

    <!-- Capa de Fondo 1 (Imagen principal activa) -->
    <div id="bg-layer-1" class="bg-layer fixed inset-0 bg-cover bg-center z-0 opacity-100 scale-100"></div>
    <!-- Capa de Fondo 2 (Para transición suave entre imágenes) -->
    <div id="bg-layer-2" class="bg-layer fixed inset-0 bg-cover bg-center z-0 opacity-0 scale-105"></div>

    <!-- Overlay de Gradiente más ligero para dejar ver las imágenes -->
    <div class="fixed inset-0 bg-gradient-to-t from-black/60 via-black/15 to-black/30 z-0 pointer-events-none"></div>
    <div class="fixed inset-0 scanline z-0 pointer-events-none opacity-25"></div>

    <!-- CORTINA METÁLICA DE TRANSICIÓN -->
    <div id="cortina-transicion" class="cortina-contenedor">
        <img src="../../resources/cortina-000000.webp" alt="Cargando..." class="cortina-imagen" onerror="this.style.display='none'">
    </div>

    <!-- MENÚ GLOBAL DE NAVEGACIÓN MOPHRA -->
    <div class="mophra-global-container" id="mophraGlobalMenu">
        <div class="mophra-global-overlay"></div>

        <button class="mophra-global-btn" id="mophraVectorBtn" title="Ver menú">
          <svg id="mophraSvgLogo" viewBox="0 0 1000 1000" class="mophra-svg-element">

    <!-- LÓGICA JAVASCRIPT DINÁMICA -->
    <script>
        // Array de datos con las compilaciones del sello
        const compilationsData = [
            {
                id: "MOPHRA017",
                title: "UNDERCOVERRNB",
                tracks: "17 tracks",
                url: "/releases/compilations/undercoverrnb/",
                description: "Edición especial que fusiona tonos R&B futuristas con ritmos nocturnos y sintetizadores profundos.",

                coverImage: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=400&auto=format&fit=crop"
            },
            {

                bannerImage: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?q=80&w=600&auto=format&fit=crop",
                coverImage: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=400&auto=format&fit=crop"
            },
            {
                id: "MOPHRA019",
                title: "ACID RAGE 90",
                tracks: "20 tracks",
                url: "/releases/compilations/acid-rage-90/",
                description: "Sonidos analógicos distorsionados de sintetizadores TB-303 preparados para pistas de baile subterráneas.",
                bgImage: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1600&auto=format&fit=crop",
                bannerImage: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=600&auto=format&fit=crop",
                coverImage: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=400&auto=format&fit=crop"
            },
            {
                id: "MOPHRA020",
                title: "NEO TOKYO DRIFT",
                tracks: "15 tracks",
                url: "/releases/compilations/neo-tokyo-drift/",
                description: "Compilación Synthwave y Cyberpunk con sonidos inspirados en la estética japonesa de los 90.",
                bgImage: "https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=1600&auto=format&fit=crop",
                bannerImage: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=600&auto=format&fit=crop",
                coverImage: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=400&auto=format&fit=crop"
            },
            {
                id: "MOPHRA021",
                title: "HYPERPOP HEAVEN",
                tracks: "14 tracks",
                url: "/releases/compilations/hyperpop-heaven/",
                description: "Vocales procesadas al límite con ritmos acelerados, bajos potentes y texturas brillantes.",
                bgImage: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1600&auto=format&fit=crop",
                bannerImage: "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=600&auto=format&fit=crop",
                coverImage: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?q=80&w=400&auto=format&fit=crop"
            },
            {
                id: "MOPHRA022",
                title: "DARK AMBIENT III",
                tracks: "09 tracks",
                url: "/releases/compilations/dark-ambient-iii/",
                description: "Paisajes sonoros desolados, atmósferas envolventes y frecuencias graves para introspección profunda.",
                bgImage: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600&auto=format&fit=crop",
                bannerImage: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&auto=format&fit=crop",
                coverImage: "https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=400&auto=format&fit=crop"
            }
        ];

        // Variables de estado y referencias al DOM
        let currentIndex = -1;
        let activeBgLayer = 1;

        const bgLayer1 = document.getElementById('bg-layer-1');
        const bgLayer2 = document.getElementById('bg-layer-2');
        const menuList = document.getElementById('menu-list');
        const menuBannerImg = document.getElementById('menu-banner-img');

        const dataCatalog = document.getElementById('data-catalog');
        const dataTitle = document.getElementById('data-title');
        const dataTracks = document.getElementById('data-tracks');
        const dataDescription = document.getElementById('data-description');
        const dataCoverImg = document.getElementById('data-cover-img');
        const viewNowBtn = document.getElementById('view-now-btn');

        // Inicializar el Menú Vertical (PC) / Horizontal (Móvil)
        function renderMenu() {
            menuList.innerHTML = '';
            compilationsData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `menu-item w-full text-left px-4 text-white font-mono text-sm tracking-wider uppercase flex items-center ${index === currentIndex ? 'active' : ''}`;
                
                btn.innerHTML = `<span class="truncate font-bold pointer-events-none pr-5">${item.title}</span>`;

                btn.addEventListener('click', () => selectCompilation(index));
                menuList.appendChild(btn);
            });
        }

        // Detectar swipe horizontal en móvil y actualizar compilación activa automáticamente
        let scrollTimeout;
        menuList.addEventListener('scroll', () => {
            if (window.innerWidth >= 768) return;
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const itemWidth = menuList.clientWidth + 10;
                if (itemWidth > 0) {
                    const newIndex = Math.round(menuList.scrollLeft / itemWidth);
                    if (newIndex !== currentIndex && newIndex >= 0 && newIndex < compilationsData.length) {
                        selectCompilation(newIndex, false);
                    }
                }
            }, 60);
        });

        // Función para cambiar suavemente el fondo con efecto de zoom cinemático
        function updateBackground(newBgUrl) {
            const currentLayer = activeBgLayer === 1 ? bgLayer1 : bgLayer2;
            const nextLayer = activeBgLayer === 1 ? bgLayer2 : bgLayer1;

            nextLayer.style.transition = 'none';
            nextLayer.style.backgroundImage = `url('${newBgUrl}')`;
            nextLayer.style.transform = 'scale(1.06)';
            nextLayer.style.filter = 'blur(4px)';
            nextLayer.style.opacity = '0';

            void nextLayer.offsetWidth;

            nextLayer.style.transition = '';
            nextLayer.style.opacity = '1';
            nextLayer.style.transform = 'scale(1)';
            nextLayer.style.filter = 'blur(0px)';

            currentLayer.style.opacity = '0';
            currentLayer.style.transform = 'scale(0.98)';

            activeBgLayer = activeBgLayer === 1 ? 2 : 1;
        }

        // Efecto scramble/decodificador para textos al cambiar de compilación
        function scrambleText(element, finalText, speed = 22) {
            if (element._scrambleInterval) clearInterval(element._scrambleInterval);
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/#*+';
            let iteration = 0;

            element._scrambleInterval = setInterval(() => {
                element.textContent = finalText
                    .split('')
                    .map((char, index) => {
                        if (char === ' ') return ' ';
                        if (index < iteration) return finalText[index];
                        return chars[Math.floor(Math.random() * chars.length)];
                    })
                    .join('');

                if (iteration >= finalText.length) {
                    clearInterval(element._scrambleInterval);
                    element.textContent = finalText;
                }
                iteration += 1 / 2;
            }, speed);
        }

        // Efecto de conteo secuencial desde 0 hasta la cifra final manteniendo fija la palabra 'tracks'
        function animateTrackCount(element, tracksString, duration = 850) {
            if (element._countFrame) cancelAnimationFrame(element._countFrame);

            const match = tracksString.match(/^(\d+)\s*(.*)$/);
            if (!match) {
                element.textContent = tracksString;
                return;
            }

            const rawNumber = match[1];
            const suffix = match[2] || 'tracks';
            const target = parseInt(rawNumber, 10);
            const padLength = rawNumber.length > 1 && rawNumber.startsWith('0') ? rawNumber.length : 0;
            const startTime = performance.now();

            function updateCounter(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = 1 - Math.pow(1 - progress, 3);
                const currentVal = Math.round(easedProgress * target);
                const formattedVal = padLength ? String(currentVal).padStart(padLength, '0') : String(currentVal);

                element.textContent = `${formattedVal} ${suffix}`;

                if (progress < 1) {
                    element._countFrame = requestAnimationFrame(updateCounter);
                } else {
                    element.textContent = `${rawNumber} ${suffix}`;
                }
            }

            element._countFrame = requestAnimationFrame(updateCounter);
        }

        // Función principal para cambiar la compilación activa
        function selectCompilation(index, syncScroll = true) {
            if (index < 0 || index >= compilationsData.length) return;
            if (index === currentIndex) return;
            currentIndex = index;

            const item = compilationsData[index];

            // 1. Actualizar Menú
            const menuButtons = menuList.querySelectorAll('.menu-item');
            menuButtons.forEach((btn, idx) => {
                if (idx === currentIndex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Sincronizar posición horizontal en móvil si se seleccionó por clic
            if (syncScroll && window.innerWidth < 768 && menuButtons[currentIndex]) {
                menuButtons[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            // 2. Actualizar Fondo
            updateBackground(item.bgImage);

            // 3. Actualizar Datos en Franja Blanca con transiciones
            const dataCard = document.getElementById('data-glass-card');
            const textElements = [dataCatalog, dataDescription];
            const mediaElements = [dataCoverImg, menuBannerImg];
            
            dataCard.classList.remove('card-pulse-transition');
            textElements.forEach(el => el.classList.remove('fade-in-element'));
            mediaElements.forEach(el => el.classList.remove('cover-zoom-in'));
            
            void dataCard.offsetWidth;

            dataCatalog.innerHTML = `<i class="fa-solid fa-barcode"></i> ${item.id}`;
            scrambleText(dataTitle, item.title, 22);
            animateTrackCount(dataTracks, item.tracks, 850);
            dataDescription.textContent = item.description;
            if (dataCoverImg) dataCoverImg.src = item.coverImage;
            menuBannerImg.src = item.bannerImage;
            if (viewNowBtn) viewNowBtn.setAttribute('href', item.url);

            dataCard.classList.add('card-pulse-transition');
            textElements.forEach(el => el.classList.add('fade-in-element'));
            mediaElements.forEach(el => el.classList.add('cover-zoom-in'));
        }

        // Inicialización al cargar la página
        window.onload = function() {
            bgLayer1.style.backgroundImage = `url('${compilationsData[0].bgImage}')`;
            renderMenu();
            selectCompilation(0);
        };

            function initMenu() {
                const menu = document.getElementById('mophraGlobalMenu');
                if (!menu) return;
                if (document.body && menu.parentElement !== document.body) document.body.appendChild(menu);

                const toggleBtn = menu.querySelector('.mophra-global-btn');
                const vectorPath = document.getElementById('mophraVectorPath');
                const overlay = menu.querySelector('.mophra-global-overlay');
                const navLinks = menu.querySelectorAll('.mophra-sign-link, a.mophra-sign-item, .mophra-sub-item');
                const relToggle = document.getElementById('mophraReleasesToggle');
                const relWrap = relToggle ? relToggle.closest('.mophra-dropdown-wrapper') : null;

                if (!toggleBtn || !vectorPath) return;

                function abrirMenu() {
                    menu.classList.add('menu-open');
                    setTimeout(() => vectorPath.setAttribute('d', PATH_X), 200);
                }

                function cerrarMenu() {
                    if (!menu.classList.contains('menu-open')) return;
                    menu.classList.remove('menu-open');
                    if (relWrap) relWrap.classList.remove('submenu-open');
                    setTimeout(() => vectorPath.setAttribute('d', PATH_LOGO), 200);
                }

                if (relToggle && relWrap) {
                    relToggle.onclick = (e) => {
                        e.preventDefault(); e.stopPropagation();
                        relWrap.classList.toggle('submenu-open');
                    };
                }

                toggleBtn.onclick = (e) => {
                    e.preventDefault(); e.stopPropagation();
                    menu.classList.contains('menu-open') ? cerrarMenu() : abrirMenu();
                };

                if (overlay) overlay.onclick = (e) => { e.stopPropagation(); cerrarMenu(); };
                navLinks.forEach(l => l.onclick = () => cerrarMenu());

                let timer;
                function animar() {
                    cerrarMenu(); clearTimeout(timer);
                    if (toggleBtn.classList.contains('animar-entrada')) {
                        toggleBtn.classList.remove('animar-entrada');
                        toggleBtn.classList.add('animar-salida');
                        timer = setTimeout(() => {
                            toggleBtn.classList.remove('animar-salida');
                            void toggleBtn.offsetWidth;
                            toggleBtn.classList.add('animar-entrada');
                        }, 450);
                    } else {
                        timer = setTimeout(() => { void toggleBtn.offsetWidth; toggleBtn.classList.add('animar-entrada'); }, 400);
                    }
                }

                window.addEventListener('popstate', animar);
                animar();
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initMenu);
            else initMenu();
        })();

        // --- LÓGICA DE LA CORTINA METÁLICA DE TRANSICIÓN ---
        (function() {
            const cortina = document.getElementById('cortina-transicion');

            function abrirCortina() {
                if (cortina) {
                    cortina.classList.remove('cerrar');
                    cortina.classList.add('abrir');
                }
            }

            window.addEventListener('load', () => {
                setTimeout(abrirCortina, 100);
            });

            window.addEventListener('pageshow', (event) => {
                if (event.persisted && cortina) {
                    cortina.classList.remove('cerrar');
                    cortina.classList.add('abrir');
                }
            });

            document.addEventListener('click', (e) => {
                const link = e.target.closest('a');
                if (!link) return;

                const href = link.getAttribute('href');
                if (href && (href.startsWith('/') || href.startsWith('.')) && !link.getAttribute('target') && !link.hasAttribute('download')) {
                    e.preventDefault();
                    
                    if (cortina) {
                        cortina.classList.remove('abrir');
                        cortina.classList.add('cerrar');
                    }

                    setTimeout(() => {
                        window.location.href = href;
                    }, 500);
                }
            });
        })();
