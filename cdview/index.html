<!DOCTYPE html>
<html lang="en" class="h-full bg-neutral-950 text-neutral-100 antialiased selection:bg-white selection:text-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOPHRA RECS — 3D Disc Archive</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Google Fonts: Inter & Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: #F5260A;
    }

    .font-mono {
      font-family: 'Space Mono', monospace;
    }

    /* Subtle Film Grain Noise Effect */
    .grain-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 40;
      opacity: 0.035;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
    }

    /* Glassmorphic Panel Styling */
    .glass-panel {
      background: rgba(10, 10, 10, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* Scrollbar styling for Tracklist */
    .custom-scrollbar::-webkit-scrollbar {
      width: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
    }

    /* Smooth text transitions */
    .ui-fade {
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ui-hidden {
      opacity: 0;
      transform: translateY(10px);
    }

    /* Aesthetic glow for active buttons */
    .btn-glow:hover {
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body class="h-full text-neutral-100 relative overflow-hidden bg-black">

  <!-- Grain Overlay -->
  <div class="grain-overlay"></div>

  <!-- Header Branding Bar -->
  <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 py-4 md:px-10 max-w-7xl mx-auto mt-2">
    <div class="flex items-center gap-3">
      <div class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></div>
      <a href="#" class="flex items-center gap-2 group">
        <span class="text-xs font-bold tracking-[0.25em] uppercase font-mono text-white group-hover:opacity-80 transition-opacity">MOPHRA RECS</span>
        <span class="text-[10px] text-neutral-500 font-mono tracking-widest">// CATALOG ARCHIVE</span>
      </a>
    </div>

    <!-- Album Counter HUD -->
    <div class="flex items-center gap-2 font-mono text-xs tracking-widest bg-neutral-900/60 border border-neutral-800/80 px-3.5 py-1.5 rounded-full backdrop-blur-md">
      <span id="current-index" class="text-white font-bold">01</span>
      <span class="text-neutral-600">/</span>
      <span id="total-count" class="text-neutral-500">04</span>
    </div>

    <!-- Controls / Auto Spin Toggle -->
    <div class="flex items-center gap-3">
      <button id="toggle-autorotate" class="px-3.5 py-1.5 rounded-full border border-neutral-800 bg-neutral-900/40 text-[10px] font-mono uppercase tracking-widest text-neutral-300 hover:text-white hover:border-neutral-500 transition-all">
        AUTO-SPIN: ON
      </button>
    </div>
  </header>

  <!-- 3D Canvas Viewport -->
  <div id="canvas-container" class="absolute inset-0 z-0 cursor-grab active:cursor-grabbing"></div>

  <!-- TOP LEFT HUD: Album & Artist Metadata -->
  <div class="fixed top-20 left-6 md:top-28 md:left-12 z-20 pointer-events-none max-w-lg">
    <div id="meta-top-left" class="ui-fade space-y-2">
      <!-- Catalog Code & Year -->
      <div class="flex items-center gap-3 text-xs font-mono text-neutral-400 tracking-wider">
        <span id="album-cat" class="text-neutral-200 font-bold bg-neutral-900/80 border border-neutral-800 px-2 py-0.5 rounded">MPH-015</span>
        <span class="text-neutral-600">•</span>
        <span id="album-year" class="text-neutral-400">2026</span>
        <span class="text-neutral-600">•</span>
        <span id="album-genre" class="text-neutral-400 uppercase tracking-widest text-[10px]">BASS HOUSE</span>
      </div>

      <!-- ALBUM TITLE (PROMINENT) -->
      <h1 id="album-title" class="text-4xl md:text-6xl font-extrabold tracking-tight text-white uppercase font-sans leading-none pt-1">
        MY LAST SOUND
      </h1>

      <!-- AUTHOR / ARTIST (BELOW) -->
      <p id="album-artist" class="text-base md:text-lg text-neutral-300 font-medium tracking-wide">
        BADDY
      </p>
    </div>
  </div>

  <!-- BOTTOM RIGHT HUD: Interactive Tracklist & Direct Link -->
  <div class="fixed bottom-6 right-6 md:bottom-10 md:right-12 z-20 max-w-sm w-full pointer-events-auto">
    <div id="meta-bottom-right" class="ui-fade flex flex-col gap-3">
      
      <!-- Tracklist Glassmorphic Card -->
      <div class="glass-panel rounded-2xl p-4 md:p-5 w-full">
        <div class="flex items-center justify-between border-b border-neutral-800/80 pb-2 mb-3">
          <p class="text-[10px] font-mono text-neutral-400 tracking-widest uppercase flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 bg-sky-400 rounded-full inline-block"></span>
            TRACKLIST
          </p>
          <span class="text-[10px] font-mono text-neutral-500" id="track-count">4 TRACKS</span>
        </div>

        <!-- Dynamic Tracks -->
        <ol id="tracklist" class="space-y-2 text-xs font-mono text-neutral-300 max-h-36 overflow-y-auto custom-scrollbar pr-1">
          <!-- Dynamically inserted tracks -->
        </ol>
      </div>

      <!-- Release Link Action Button -->
      <a id="album-release-btn" href="#" target="_blank" rel="noopener" class="glass-panel btn-glow rounded-xl py-3 px-5 flex items-center justify-between group transition-all duration-300 hover:border-white/40 hover:bg-white/10">
        <div class="flex items-center gap-2">
          <span class="text-[11px] font-mono tracking-widest text-white uppercase font-semibold">VIEW OFFICIAL RELEASE</span>
        </div>
        <span class="text-sm text-neutral-400 group-hover:text-white group-hover:translate-x-1 transition-transform">→</span>
      </a>

    </div>
  </div>

  <!-- Bottom Navigation Helpers -->
  <div class="fixed bottom-6 left-6 md:left-12 z-20 pointer-events-auto flex items-center gap-4">
    <div class="flex items-center gap-2">
      <button id="btn-prev" class="w-11 h-11 rounded-full glass-panel border border-neutral-800 flex items-center justify-center text-neutral-300 hover:text-white hover:border-neutral-500 transition-all active:scale-95">
        ←
      </button>
      <button id="btn-next" class="w-11 h-11 rounded-full glass-panel border border-neutral-800 flex items-center justify-center text-neutral-300 hover:text-white hover:border-neutral-500 transition-all active:scale-95">
        →
      </button>
    </div>
    <div class="hidden sm:block text-left">
      <p class="text-[10px] font-mono text-neutral-400 tracking-wider">DRAG MOUSE: 360° ROTATE ACTIVE DISK</p>
      <p class="text-[9px] font-mono text-neutral-600">SCROLL WHEEL: SNAP BETWEEN ALBUMS</p>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    /* =========================================================================
       1. DATASET DEFINITION (MOPHRA RECS ARCHIVE)
       ========================================================================= */
    const ALBUMS = [
      {
        id: "mylastsound",
        title: "MY LAST SOUND",
        artist: "BADDY",
        year: "2026",
        cat: "MPH-015",
        genre: "BASS HOUSE",
        releaseUrl: "https://github.com",
        colors: { base: "#0f172a", accent: "#38bdf8", disc: "#1e293b" },
        customImage: "https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/other/official-artwork/25.png",
        tracks: [
          "01. My Last Sound (03:42)",
          "02. CHOKE (04:15)",
          "03. Backstage (03:10)",
          "04. Bounce (03:55)"
        ]
      },
      {
        id: "voidstar",
        title: "VOIDSTAR",
        artist: "GEORGE LYCATS & ROBO_AIKO",
        year: "2026",
        cat: "MPH-016",
        genre: "HYBRID TRAP",
        releaseUrl: "https://github.com",
        colors: { base: "#18181b", accent: "#ef4444", disc: "#27272a" },
        customImage: "https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/other/official-artwork/6.png",
        tracks: [
          "01. voidSTAR (Original Mix) (03:11)",
          "02. voidSTAR (Extended VIP) (04:33)",
          "03. Eclipse Pulse (03:50)"
        ]
      },
      {
        id: "usbhot",
        title: "USB HOT",
        artist: "MOPHRA COLLECTIVE",
        year: "2026",
        cat: "MPH-017",
        genre: "Y2K HARDWARE",
        releaseUrl: "https://github.com",
        colors: { base: "#172554", accent: "#f59e0b", disc: "#1e3a8a" },
        customImage: "https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/other/official-artwork/150.png",
        tracks: [
          "01. Drive Initialize (02:50)",
          "02. Data Burst (03:45)",
          "03. Sector 04 (04:12)"
        ]
      },
      {
        id: "compilation",
        title: "MOPHRA COMPILATION",
        artist: "VARIOUS ARTISTS",
        year: "2026",
        cat: "MPH-018",
        genre: "UNDERGROUND BASS",
        releaseUrl: "https://github.com",
        colors: { base: "#064e3b", accent: "#10b981", disc: "#022c22" },
        customImage: "", // Procedural Fallback
        tracks: [
          "01. Overdrive (03:30)",
          "02. Cyberpunk Synth (04:02)",
          "03. Sub Impact (03:50)",
          "04. Frequency shift (04:20)"
        ]
      }
    ];

    /* =========================================================================
       2. CANVAS-BASED ARTWORK MASKING (DONUT CUTOUT)
       ========================================================================= */
    function createMaskedArtworkTexture(imageOrUrl, album, callback) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const cx = 512, cy = 512;
      const outerR = 512;
      const innerR = 150; // Inner hole

      function drawBaseAndMask(img) {
        ctx.clearRect(0, 0, 1024, 1024);

        // 1. Draw image or background pattern
        if (img) {
          const aspect = img.width / img.height;
          let dw = 1024, dh = 1024;
          if (aspect > 1) dw = 1024 * aspect;
          else dh = 1024 / aspect;
          ctx.drawImage(img, (1024 - dw) / 2, (1024 - dh) / 2, dw, dh);
        } else {
          // Procedural artwork if no image
          const grad = ctx.createRadialGradient(cx, cy, 100, cx, cy, 512);
          grad.addColorStop(0, album.colors.disc);
          grad.addColorStop(0.7, album.colors.base);
          grad.addColorStop(1, '#000000');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 1024, 1024);

          ctx.lineWidth = 3;
          for (let i = 0; i < 360; i += 6) {
            const rad = (i * Math.PI) / 180;
            ctx.strokeStyle = (i % 12 === 0) ? album.colors.accent : 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(rad) * 160, cy + Math.sin(rad) * 160);
            ctx.lineTo(cx + Math.cos(rad) * 500, cy + Math.sin(rad) * 500);
            ctx.stroke();
          }

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 42px "Space Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(album.title.toUpperCase(), cx, 220);
          ctx.fillStyle = album.colors.accent;
          ctx.font = '24px "Space Mono", monospace';
          ctx.fillText(album.artist.toUpperCase(), cx, 820);
        }

        // Punch out central hole cleanly
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
        ctx.fill();

        // Punch out outer circle corners
        ctx.beginPath();
        ctx.rect(0, 0, 1024, 1024);
        ctx.arc(cx, cy, outerR, 0, Math.PI * 2, true);
        ctx.fill();

        ctx.globalCompositeOperation = 'source-over';

        const texture = new THREE.CanvasTexture(canvas);
        if (THREE.sRGBEncoding) texture.encoding = THREE.sRGBEncoding;
        texture.needsUpdate = true;
        callback(texture);
      }

      if (imageOrUrl && typeof imageOrUrl === 'string' && imageOrUrl.trim() !== "") {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => drawBaseAndMask(img);
        img.onerror = () => drawBaseAndMask(null);
        img.src = imageOrUrl;
      } else {
        drawBaseAndMask(null);
      }
    }

    /* =========================================================================
       3. THREE.JS SYSTEM VARIABLES & SETUP
       ========================================================================= */
    let scene, camera, renderer;
    const cdGroups = [];

    // Navigation & Scroll
    let currentIndex = 0;
    let targetScroll = 0;
    let currentScroll = 0;
    const SPACING = 5.2;

    // 360 Free Interactive Rotation States per CD
    const rotations = ALBUMS.map(() => ({
      rotX: 0,
      rotY: 0,
      velX: 0,
      velY: 0
    }));

    // Drag / Touch Tracking
    let isDragging = false;
    let previousMouseX = 0;
    let previousMouseY = 0;
    let totalDragDistance = 0;
    let autoRotate = true;

    function init() {
      const container = document.getElementById('canvas-container');

      // Scene
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050505, 0.07);

      // Camera
      camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 7.2);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Studio Lighting
      setupLighting();

      // Build CD Objects
      ALBUMS.forEach((album, idx) => {
        const cdGroup = buildCDMesh(album);
        cdGroup.position.x = idx * SPACING;
        scene.add(cdGroup);
        cdGroups.push(cdGroup);
      });

      // UI Initial Setup
      document.getElementById('total-count').innerText = String(ALBUMS.length).padStart(2, '0');
      updateHUD(0, true);

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('wheel', onWheel, { passive: false });
      window.addEventListener('keydown', onKeyDown);
      setupInteractions(container);
      setupUIControls();

      // Render Loop
      animate();
    }

    /* =========================================================================
       4. LIGHTING & REALISTIC CD MESH GENERATOR
       ========================================================================= */
    function setupLighting() {
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
      keyLight.position.set(4, 6, 5);
      scene.add(keyLight);

      // Blue Holographic Rim
      const rimLight1 = new THREE.PointLight(0x38bdf8, 3.5, 15);
      rimLight1.position.set(-5, 4, -2);
      scene.add(rimLight1);

      // Magenta Holographic Rim
      const rimLight2 = new THREE.PointLight(0xe879f9, 3.0, 15);
      rimLight2.position.set(5, -4, -2);
      scene.add(rimLight2);
    }

    function buildCDMesh(album) {
      const group = new THREE.Group();

      const outerRadius = 1.85;
      const innerRadius = 0.28;
      const hubRadius = 0.55;
      const thickness = 0.035;

      // 1. Base CD Geometry (Extruded Ring for thickness & metallic iridescence)
      const shape = new THREE.Shape();
      shape.absarc(0, 0, outerRadius, 0, Math.PI * 2, false);
      const holePath = new THREE.Path();
      holePath.absarc(0, 0, innerRadius, 0, Math.PI * 2, true);
      shape.holes.push(holePath);

      const cdGeometry = new THREE.ExtrudeGeometry(shape, {
        depth: thickness,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.008,
        bevelThickness: 0.004,
        curveSegments: 96
      });
      cdGeometry.center();

      const cdMetalMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xd4d4d4,
        metalness: 0.98,
        roughness: 0.12,
        clearcoat: 1.0,
        clearcoatRoughness: 0.04,
        reflectivity: 1.0,
        iridescence: 1.0,
        iridescenceIOR: 1.35,
        iridescenceThicknessRange: [100, 400]
      });

      const cdBaseMesh = new THREE.Mesh(cdGeometry, cdMetalMaterial);
      group.add(cdBaseMesh);

      // 2. Printed Front Artwork
      const frontPlaneGeo = new THREE.PlaneGeometry(outerRadius * 2, outerRadius * 2);
      const frontMat = new THREE.MeshPhysicalMaterial({
        metalness: 0.05,
        roughness: 0.35,
        clearcoat: 0.8,
        transparent: true,
        side: THREE.FrontSide
      });

      createMaskedArtworkTexture(album.customImage, album, (texture) => {
        frontMat.map = texture;
        frontMat.needsUpdate = true;
      });

      const frontMesh = new THREE.Mesh(frontPlaneGeo, frontMat);
      frontMesh.position.z = (thickness / 2) + 0.002;
      group.add(frontMesh);

      // 3. Clear Plastic Center Hub
      const hubShape = new THREE.Shape();
      hubShape.absarc(0, 0, hubRadius, 0, Math.PI * 2, false);
      const hubHole = new THREE.Path();
      hubHole.absarc(0, 0, innerRadius, 0, Math.PI * 2, true);
      hubShape.holes.push(hubHole);

      const hubGeometry = new THREE.ExtrudeGeometry(hubShape, { 
        depth: thickness + 0.006, 
        bevelEnabled: false, 
        curveSegments: 64 
      });
      hubGeometry.center();

      const plasticHubMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.35,
        roughness: 0.1,
        transmission: 0.9,
        ior: 1.5
      });

      const hubMesh = new THREE.Mesh(hubGeometry, plasticHubMaterial);
      group.add(hubMesh);

      group.userData = { album };
      return group;
    }

    /* =========================================================================
       5. 360° INTERACTIVE ROTATION & DRAG CONTROLS
       ========================================================================= */
    function setupInteractions(container) {
      const startDrag = (x, y) => {
        isDragging = true;
        previousMouseX = x;
        previousMouseY = y;
        totalDragDistance = 0;
      };

      const moveDrag = (x, y) => {
        if (!isDragging) return;

        const deltaX = x - previousMouseX;
        const deltaY = y - previousMouseY;

        totalDragDistance += Math.abs(deltaX) + Math.abs(deltaY);

        // Apply 360 rotation to currently focused album
        const r = rotations[currentIndex];
        r.velY = deltaX * 0.008;
        r.velX = deltaY * 0.008;

        previousMouseX = x;
        previousMouseY = y;
      };

      const endDrag = () => {
        isDragging = false;
      };

      // Mouse Listeners
      container.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
      window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
      window.addEventListener('mouseup', endDrag);

      // Touch Listeners
      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
      });
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      });
      window.addEventListener('touchend', endDrag);

      // Click vs Drag Detection for Web Link
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      container.addEventListener('click', (e) => {
        // Only open link if it was a quick click rather than a rotation drag
        if (totalDragDistance > 10) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(cdGroups[currentIndex].children);

        if (intersects.length > 0) {
          const url = ALBUMS[currentIndex].releaseUrl;
          if (url) window.open(url, '_blank');
        }
      });
    }

    function onWheel(e) {
      e.preventDefault();
      const delta = Math.sign(e.deltaY);
      if (delta > 0) {
        changeAlbum(currentIndex + 1);
      } else if (delta < 0) {
        changeAlbum(currentIndex - 1);
      }
    }

    function onKeyDown(e) {
      if (e.key === 'ArrowRight') changeAlbum(currentIndex + 1);
      if (e.key === 'ArrowLeft') changeAlbum(currentIndex - 1);
    }

    function changeAlbum(newIdx) {
      const clamped = Math.max(0, Math.min(ALBUMS.length - 1, newIdx));
      if (clamped !== currentIndex) {
        // Reset old CD rotations smoothly
        const prevRot = rotations[currentIndex];
        prevRot.rotX = 0;
        prevRot.rotY = 0;
        prevRot.velX = 0;
        prevRot.velY = 0;

        targetScroll = clamped;
      }
    }

    function setupUIControls() {
      document.getElementById('btn-next').addEventListener('click', () => changeAlbum(currentIndex + 1));
      document.getElementById('btn-prev').addEventListener('click', () => changeAlbum(currentIndex - 1));

      const autoBtn = document.getElementById('toggle-autorotate');
      autoBtn.addEventListener('click', () => {
        autoRotate = !autoRotate;
        autoBtn.innerText = `AUTO-SPIN: ${autoRotate ? 'ON' : 'OFF'}`;
        autoBtn.classList.toggle('border-sky-500', autoRotate);
      });
    }

    /* =========================================================================
       6. UI METADATA UPDATE & FADE
       ========================================================================= */
    function updateHUD(index, force = false) {
      if (currentIndex === index && !force) return;
      currentIndex = index;

      const album = ALBUMS[currentIndex];
      const topLeft = document.getElementById('meta-top-left');
      const bottomRight = document.getElementById('meta-bottom-right');

      topLeft.classList.add('ui-hidden');
      bottomRight.classList.add('ui-hidden');

      setTimeout(() => {
        document.getElementById('current-index').innerText = String(currentIndex + 1).padStart(2, '0');
        document.getElementById('album-title').innerText = album.title;
        document.getElementById('album-artist').innerText = album.artist;
        document.getElementById('album-year').innerText = album.year;
        document.getElementById('album-cat').innerText = album.cat;
        document.getElementById('album-genre').innerText = album.genre;
        document.getElementById('album-release-btn').href = album.releaseUrl;

        const tracklistEl = document.getElementById('tracklist');
        tracklistEl.innerHTML = '';
        album.tracks.forEach(track => {
          const li = document.createElement('li');
          li.className = 'hover:text-white transition-colors cursor-pointer py-0.5 border-b border-neutral-900/60 flex items-center justify-between';
          li.innerHTML = `<span>${track}</span>`;
          tracklistEl.appendChild(li);
        });
        document.getElementById('track-count').innerText = `${album.tracks.length} TRACKS`;

        topLeft.classList.remove('ui-hidden');
        bottomRight.classList.remove('ui-hidden');
      }, 200);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* =========================================================================
       7. ANIMATION RENDER LOOP
       ========================================================================= */
    function animate() {
      requestAnimationFrame(animate);

      // Smooth carousel movement
      currentScroll += (targetScroll - currentScroll) * 0.08;

      const closestIndex = Math.round(currentScroll);
      if (closestIndex !== currentIndex && Math.abs(currentScroll - closestIndex) < 0.2) {
        updateHUD(closestIndex);
      }

      // Update 3D CD positioning and 360 free rotation physics
      cdGroups.forEach((group, idx) => {
        const dist = idx - currentScroll;
        const absDist = Math.abs(dist);

        group.position.x = dist * SPACING;
        group.position.z = -absDist * 1.5;
        group.position.y = Math.sin(Date.now() * 0.0015 + idx) * 0.08;

        const scale = Math.max(0.65, 1.0 - absDist * 0.22);
        group.scale.set(scale, scale, scale);

        const rot = rotations[idx];

        if (idx === closestIndex) {
          // Physics & Inertia dampening for active CD
          rot.rotX += rot.velX;
          rot.rotY += rot.velY;

          rot.velX *= 0.92;
          rot.velY *= 0.92;

          // Auto-spin logic if not dragging
          if (autoRotate && !isDragging && Math.abs(rot.velY) < 0.001) {
            rot.rotY += 0.008;
          }

          group.rotation.x = rot.rotX;
          group.rotation.y = rot.rotY;
        } else {
          // Non-active CDs align to facing angle and reset smoothly
          rot.rotX *= 0.85;
          rot.rotY *= 0.85;
          rot.velX = 0;
          rot.velY = 0;

          group.rotation.x = rot.rotX;
          group.rotation.y = dist * -0.35 + rot.rotY;
        }
      });

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
